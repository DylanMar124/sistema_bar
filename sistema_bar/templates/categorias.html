{% extends 'base.html' %}

{% block content %}
<h1 class="font-headline font-bold text-2xl mb-4">Categorias</h1>

<button type="button" onclick="openModal('crearCategoriaModal')" 
    class="bg-neutral-500 hover:bg-neutral-700 text-white font-bold py-2 px-4 rounded inline-flex items-center mb-4">
    <span class="material-symbols-outlined text-sm mr-2">add</span> Crear Nueva Categoria
</button>

<div id="crearCategoriaModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-headline font-semibold">Crear Categoria</h3>
            <button type="button" onclick="closeModal('crearCategoriaModal')" class="text-gray-400 hover:text-gray-600">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form action="{{ url_for('categorias.crear_categoria') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" onclick="closeModal('crearCategoriaModal')" 
                    class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                    Cancelar
                </button>
                <button type="submit" 
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200" id="tablaProductos">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for categorias in categorias %}
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ categorias.id }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ categorias.nombre }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <!-- Botón editar -->
                    <button type="button" onclick="editarProducto({{ categorias.id }}, '{{ categorias.nombre }}')" 
                        class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-1 px-3 rounded inline-flex items-center mr-2">
                        <span class="material-symbols-outlined text-sm mr-1">edit</span> Modificar
                    </button>
                    <!-- Botón activar/desactivar -->
                     <form action="{{ url_for('categorias.eliminar_categoria', categoria_id=categorias.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-3 rounded inline-flex items-center"
                            onclick="return confirm('¿Eliminar categoria?')">
                                <span class="material-symbols-outlined text-sm mr-1">cancel</span> Eliminar
                        </button>
                     </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div id="editarProductoModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-headline font-semibold">Editar Categoria</h3>
            <button type="button" onclick="closeModal('editarProductoModal')" class="text-gray-400 hover:text-gray-600">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form action="{{ url_for('categorias.editar_categoria') }}" method="POST">
            <input type="hidden" name="categoria_id" id="edit-id">
            <div class="space-y-4">
                <div>
                    <label for="edit-nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
                    <input type="text" id="edit-nombre" name="nombre" required 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" onclick="closeModal('editarProductoModal')" 
                    class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                    Cancelar
                </button>
                <button type="submit" 
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Guardar cambios
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    if (document.getElementById("tablaProductos") && typeof simpleDatatables.DataTable !== 'undefined') {
    const dataTable = new simpleDatatables.DataTable("#tablaProductos");
    }

    // Funciones para modales
    function openModal(id) {
        document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
        document.getElementById(id).classList.add('hidden');
    }

    // Función para llenar modal de edición
    function editarProducto(id, nombre) {
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-nombre').value = nombre;
        openModal('editarProductoModal');
    }

    // Cerrar modal al hacer clic fuera del contenido
    window.onclick = function(event) {
        if (event.target.classList.contains('fixed')) {
            closeModal('crearCategoriaModal');
            closeModal('editarProductoModal');
        }
    }
</script>
{% endblock %}
