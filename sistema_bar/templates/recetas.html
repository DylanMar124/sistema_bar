{% extends 'base.html' %}

{% block content %}
<h1 class="font-headline font-bold text-2xl mb-4">Recetas de Productos</h1>

<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200" id="tablaProductos">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Producto</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Categoría</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for p in productos %}
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ p.id }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ p.nombre }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ p.categoria.nombre }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <!-- Botón editar -->
                    <a href="{{ url_for('recetas.ver_receta', producto_id=p.id) }}"
                        class="bg-sky-500 hover:bg-sky-700 text-white font-bold py-1 px-3 rounded inline-flex items-center mr-2">
                        <span class="material-symbols-outlined text-sm mr-1">table_eye</span> Ver Receta
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    if (document.getElementById("tablaProductos") && typeof simpleDatatables.DataTable !== 'undefined') {
    const dataTable = new simpleDatatables.DataTable("#tablaProductos");
    }
</script>
{% endblock %}
